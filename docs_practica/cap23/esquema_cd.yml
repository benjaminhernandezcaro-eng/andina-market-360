name: CI y Despliegue Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
  publicar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Publicacion habilitada solo si validar termina en verde'
